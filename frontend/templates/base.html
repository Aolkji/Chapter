<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChapterChat{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Navigation: swap the "#" links for url_for(...) once those routes exist -->
    <nav class="navbar">
        <div class="container nav-inner">
            <a href="{{ url_for('main.index') }}" class="logo">Chapter<span>Chat</span></a>
            <ul class="nav-links">
                <li><a href="{{ url_for('main.index') }}">Books</a></li>
                <li><a href="#">Discussions</a></li>
                <li><a href="#">Log in</a></li>
                <li><a href="#" class="btn btn-small">Sign up</a></li>
            </ul>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p><strong>ChapterChat</strong> · A Chapter at a Time</p>
            <p class="muted">Built by Emmanuel Athias · CISC 4900, Brooklyn College</p>
        </div>
    </footer>
</body>
</html>
