{% extends "base.html" %}

{% block title %}Sign up · ChapterChat{% endblock %}

{% block content %}
<section class="section">
    <div class="container narrow">
        <h1>Create your account</h1>
        <p class="subtitle">Join our community and start chatting!</p>

        <form method="Post" action="{{url_for('auth.register')}}" class="form-card">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value = "{{username or ''}}" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" value = "{{email or ''}}" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required>

            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" minlength="6" required>

            <div class="form-actions">
                <button type="submit" class="btn">Sign up</button>
            </div>  
        </form>

        <p class ="form-footer">
            Already have an account? <a href="{{url_for('auth.login')}}">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
