{% extends "base.html" %}

{% block title %}Log in · ChapterChat{% endblock %}

{% block content %}
<section class="section">
    <div class="container narrow">
        <h1>Log in</h1>
        <p class="muted">Welcome back to your book club.</p>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="form-card">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email or '' }}" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label class="checkbox">
                <input type="checkbox" name="remember"> Remember me
            </label>

            <div class="form-actions">
                <button type="submit" class="btn">Log in</button>
            </div>
        </form>

        <p class="form-footer">
            New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>
    </div>
</section>
{% endblock %}
