{% extends "base.html" %}

{% set is_edit = mode == "edit" %}

{% block title %}{{ "Edit book" if is_edit else "Add a book" }} · ChapterChat{% endblock %}

{% block content %}
<section class="section">
    <div class="container narrow">
        <a href="{{ url_for('books.book_detail', book_id=book.id) if is_edit else url_for('main.index') }}" class="back-link">← Back</a>

        <h1>{{ "Edit book" if is_edit else "Add a book" }}</h1>

        <form method="POST"
              action="{{ url_for('books.edit_book', book_id=book.id) if is_edit else url_for('books.add_book') }}"
              class="form-card">

            <label for="title">Title <span class="required">*</span></label>
            <input type="text" id="title" name="title" value="{{ book.title or '' }}" required>

            <label for="author">Author <span class="required">*</span></label>
            <input type="text" id="author" name="author" value="{{ book.author or '' }}" required>

            <label for="genre">Genre</label>
            <input type="text" id="genre" name="genre" value="{{ book.genre or '' }}" placeholder="e.g. Fantasy, Mystery">

            <label for="cover_image">Cover image URL</label>
            <input type="url" id="cover_image" name="cover_image" value="{{ book.cover_image or '' }}" placeholder="https://...">

            <div class="form-actions">
                <button type="submit" class="btn">{{ "Save changes" if is_edit else "Add book" }}</button>
                <a href="{{ url_for('books.book_detail', book_id=book.id) if is_edit else url_for('main.index') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
